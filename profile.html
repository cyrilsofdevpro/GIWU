<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Profile — GiwuLogStore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="brand">GiwuLogStore</a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="chat.html">Chat</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <section class="profile-card-panel">
        <div class="profile-header">
          <div>
            <p class="hero-text">Account overview</p>
            <h1>My Profile</h1>
          </div>
          <button id="signout-button" class="btn btn-secondary">Sign out</button>
        </div>
        <div id="profile-details" class="content-panel">
          <div class="profile-row"><span>Name</span><strong id="profile-name">Loading…</strong></div>
          <div class="profile-row"><span>Email</span><strong id="profile-email">Loading…</strong></div>
          <div class="profile-row"><span>Role</span><strong id="profile-role">Loading…</strong></div>
          <div class="profile-row"><span>Member since</span><strong id="profile-created">Loading…</strong></div>
        </div>
        <div class="auth-actions">
          <a href="chat.html" class="btn btn-primary">Open chat</a>
          <a href="index.html" class="btn btn-secondary">Back home</a>
        </div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu.js"></script>
  <script>
    async function loadProfile(){
      if(!window.GiwuAuth) return window.location.href='login.html';
      const user=await window.GiwuAuth.getUser();
      if(!user) return window.location.href='login.html';
      const profile=await window.GiwuAuth.getProfile();
      const fullName=profile?.full_name||user.user_metadata?.full_name||user.email.split('@')[0];
      const role=profile?.role||user.user_metadata?.role||'customer';
      const createdAt=profile?.created_at?new Date(profile.created_at).toLocaleDateString():'Unknown';
      document.getElementById('profile-name').textContent=fullName;
      document.getElementById('profile-email').textContent=user.email;
      document.getElementById('profile-role').textContent=role==='admin'?'Administrator':'Customer';
      document.getElementById('profile-created').textContent=createdAt;
    }
    document.getElementById('signout-button').addEventListener('click',async()=>{await window.GiwuAuth.logout();window.location.href='index.html';});
    loadProfile();
  </script>
</body>
</html>
