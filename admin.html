<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Admin — GiwuLogStore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <main class="admin-shell">
    <aside class="sidebar">
      <section class="panel">
        <strong class="brand">GiwuLogStore</strong>
        <p class="hero-text">Admin console</p>
      </section>
      <nav class="list-panel">
        <a href="admin.html" class="btn btn-secondary">Dashboard</a>
        <a href="#" class="btn btn-secondary">Chats</a>
        <a href="#" class="btn btn-secondary">Users</a>
        <a href="#" class="btn btn-secondary">Settings</a>
      </nav>
      <button id="admin-logout" class="btn btn-primary">Logout</button>
    </aside>
    <section class="admin-panel">
      <div class="panel-header">
        <div>
          <p class="hero-text">Operations</p>
          <h1>Live support dashboard</h1>
        </div>
        <span>Online</span>
      </div>
      <div class="admin-grid">
        <section class="panel">
          <h3>Overview</h3>
          <div id="admin-stats"></div>
        </section>
        <section class="panel">
          <h3>Active customers</h3>
          <div id="customer-list"></div>
        </section>
      </div>
      <section class="panel">
        <div class="panel-header">
          <div>
            <h3 id="active-guest">Select a customer</h3>
            <p id="active-status">Waiting for chat</p>
          </div>
        </div>
        <div class="messages admin-messages" id="admin-messages"></div>
        <div class="chat-composer">
          <input id="admin-input" type="text" placeholder="Reply as admin..." autocomplete="off" />
          <button class="btn btn-primary" id="admin-send">Reply</button>
        </div>
      </section>
    </section>
  </main>
  <div class="toast" id="toast" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
