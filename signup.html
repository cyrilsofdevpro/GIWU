<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Sign up — GiwuLogStore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <strong class="brand">GiwuLogStore</strong>
      <h2>Create account</h2>
      <form id="signup-form">
        <div class="field-group"><label>Full name<input id="signup-name" type="text" required /></label></div>
        <div class="field-group"><label>Email address<input id="signup-email" type="email" required /></label></div>
        <div class="field-group"><label>Password<input id="signup-password" type="password" required /></label></div>
        <div class="auth-actions">
          <button type="submit" class="btn btn-primary">Create account</button>
          <a href="login.html" class="btn btn-secondary">Already have an account</a>
        </div>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
