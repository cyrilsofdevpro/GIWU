<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — GiwuLogStore</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <main class="auth-page container">
      <div class="glass-card auth-card">
        <h2>Sign in</h2>
        <form id="login-form">
          <label>Email<div><input id="login-email" type="email" required /></div></label>
          <label>Password<div><input id="login-password" type="password" required /></div></label>
          <div class="actions">
            <button type="submit" class="btn btn-primary">Sign in</button>
            <a href="signup.html" class="btn btn-secondary">Create account</a>
          </div>
        </form>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/env.js"></script>
    <script src="js/auth.js"></script>
    <script>
      const form = document.getElementById('login-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        try {
          await window.GiwuAuth.login(email, password);
          const target = await window.GiwuAuth.isAdmin() ? 'admin.html' : 'chat.html';
          window.location.href = target;
        } catch (err) { alert(err.message); }
      });
    </script>
  </body>
</html>
